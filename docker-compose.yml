version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ransomtrace_postgres
    restart: always
    environment:
      POSTGRES_USER: ransomtrace_user
      POSTGRES_PASSWORD: ransomtrace_password
      POSTGRES_DB: ransomtrace_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ransomtrace_user -d ransomtrace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
